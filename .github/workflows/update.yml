name: Update site

on:
  schedule:
    - cron: "11 */6 * * *"              # four times a day, all year
    - cron: "*/30 22-23 * 11,12,1,2 *"  # evenings in season, Eastern 5 PM to 7 PM
    - cron: "*/30 0-5 * 11,12,1,2,3 *"  # evenings in season, Eastern 7 PM to 1 AM
    - cron: "*/30 16-21 * 11,12,1,2 6"  # Saturday afternoons in season
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Fetch data and build the page
        run: |
          python fetch_data.py || echo "fetch reported errors; building with what it got"
          python build_site.py
      - name: Commit and push when anything changed
        run: |
          git config user.name "miaa-hoops"
          git config user.email "miaa-hoops@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
